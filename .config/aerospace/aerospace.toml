after-startup-command = [
    "exec-and-forget ~/.config/scripts/system/macos-key-remap",
    "exec-and-forget ~/.config/scripts/system/macos-load-ssh-keys"
]
start-at-login = true
config-version = 2
on-focus-changed = 'move-mouse window-lazy-center'
automatically-unhide-macos-hidden-apps = true
focus-follows-mouse.enabled = false
auto-reload-config = true

[mode.main.binding]
    alt-enter = 'exec-and-forget open /Applications/Alacritty.app'
    ctrl-enter = 'exec-and-forget open /Applications/Alacritty.app'
    alt-shift-e = 'exec-and-forget open -a /System/Library/CoreServices/Finder.app'
    alt-space = 'exec-and-forget open -a /System/Library/CoreServices/Finder.app'
    f16 = 'exec-and-forget ~/.config/scripts/system/macos-mic/toggle.sh'

    alt-o = 'layout floating tiling'
    alt-t = 'layout tiling'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-n = 'workspace next'
    alt-p = 'workspace prev'

    ctrl-shift-n = ['focus-monitor next', 'move-mouse window-force-center']
    ctrl-shift-p = ['focus-monitor prev', 'move-mouse window-force-center']

    alt-r = 'mode resize'

    ctrl-cmd-f = 'fullscreen'
    ctrl-shift-f = 'macos-native-fullscreen'

    # alt-c = 'center window'

    ctrl-cmd-h = 'move left'
    ctrl-cmd-j = 'move down'
    ctrl-cmd-k = 'move up'
    ctrl-cmd-l = 'move right'

    ctrl-shift-semicolon = 'mode service'

    ctrl-1 = 'workspace --auto-back-and-forth 1-web'
    ctrl-2 = 'workspace --auto-back-and-forth 2-cli'
    ctrl-3 = 'workspace --auto-back-and-forth 3-dev'
    ctrl-4 = 'workspace --auto-back-and-forth 4-ofc'
    ctrl-7 = 'workspace --auto-back-and-forth 7-doc'
    ctrl-8 = 'workspace --auto-back-and-forth 8-msg'
    ctrl-9 = 'workspace --auto-back-and-forth 9-con'
    ctrl-0 = 'workspace --auto-back-and-forth 0-etc'

    ctrl-cmd-1 = 'move-node-to-workspace 1-web --focus-follows-window'
    ctrl-cmd-2 = 'move-node-to-workspace 2-cli --focus-follows-window'
    ctrl-cmd-3 = 'move-node-to-workspace 3-dev --focus-follows-window'
    ctrl-cmd-4 = 'move-node-to-workspace 4-ofc --focus-follows-window'
    ctrl-cmd-7 = 'move-node-to-workspace 7-doc --focus-follows-window'
    ctrl-cmd-8 = 'move-node-to-workspace 8-msg --focus-follows-window'
    ctrl-cmd-9 = 'move-node-to-workspace 9-con --focus-follows-window'
    ctrl-cmd-0 = 'move-node-to-workspace 0-etc --focus-follows-window'

    ctrl-backtick = 'workspace-back-and-forth' # ctrl + `
    ctrl-shift-backtick = 'move-workspace-to-monitor --wrap-around next' # ctrl + shift + `

    cmd-h = []     # Disable "hide application"
    cmd-alt-h = [] # Disable "hide others"

[workspace-to-monitor-force-assignment]
    7-doc = 'secondary'
    8-msg = 'secondary'
    9-con = 'secondary'
    0-etc = 'secondary'

[mode.resize.binding]
    h = 'resize width +50'
    j = 'resize height -50'
    k = 'resize height +50'
    l = 'resize width -50'
    b = 'balance-sizes'
    q = 'mode main'
    enter = 'mode main'
    esc = 'mode main'
    alt-r = 'mode main'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    q = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = [ 'layout floating tiling', 'mode main', ] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

# Floating windows
[[on-window-detected]]
    if = 'test %{app-name} = Finder'
    run = 'layout floating'
[[on-window-detected]]
    if = """test %{app-bundle-id} = is.gtmetronome \
        || test %{app-bundle-id} = de.naiv.MacOSTuner \
        || test %{app-bundle-id} = com.apple.calculator \
        || test %{app-bundle-id} = ca.psiphon.Psiphon \
        || test %{app-bundle-id} = com.electron.ollama \
        || test %{app-bundle-id} = cc.ffitch.shottr"""
    run = ['layout floating']

# Workspace 1 — Browsers
[[on-window-detected]]
    if = """test %{app-bundle-id} = org.chromium.Chromium \
        || test %{app-bundle-id} = com.brave.Browser \
        || test %{app-bundle-id} = net.imput.helium \
        || test %{app-bundle-id} = com.apple.Safari"""
    check-further-callbacks = true
    run = ['layout floating', 'fullscreen', 'move-node-to-workspace 1-web']

# Workspace 2 — Terminal
[[on-window-detected]]
    if = 'test %{app-bundle-id} = org.alacritty'
    run = 'move-node-to-workspace 2-cli'

# Workspace 3 — AI / dev / VPN / система
[[on-window-detected]]
    if = """test %{app-bundle-id} = com.openai.chat \
        || test %{app-bundle-id} = ai.perplexity.mac \
        || test %{app-bundle-id} = com.parallels.desktop.console \
        || test %{app-bundle-id} = com.ru.dolphin.anty \
        || test %{app-bundle-id} = com.apple.iCal \
        || test %{app-bundle-id} = com.apple.weather \
        || test %{app-bundle-id} = org.jkiss.dbeaver.core.product \
        || test %{app-bundle-id} = tabularis \
        || test %{app-bundle-id} = io.httpie.desktop \
        || test %{app-bundle-id} = dev.kdrag0n.MacVirt \
        || test %{app-bundle-id} = org.openvpn.client.app \
        || test %{app-bundle-id} = com.viscosityvpn.Viscosity \
        || test %{app-bundle-id} = com.wireguard.macos \
        || test %{app-bundle-id} = net.tunnelblick.tunnelblick"""
    run = ['move-node-to-workspace 3-dev']

# Workspace 4 — Office / Art / Mail
[[on-window-detected]]
    if = """test %{app-bundle-id} = com.apple.garageband9 \
        || test %{app-bundle-id} = com.arobas-music.guitarpro8 \
        || test %{app-bundle-id} = com.apple.mail \
        || test %{app-bundle-id} = com.apple.systempreferences \
        || test %{app-bundle-id} = org.freac.freac \
        || test %{app-bundle-id} = com.nightbirdsevolve.Meta \
        || test %{app-bundle-id} = com.microsoft.Word \
        || test %{app-bundle-id} = com.microsoft.Powerpoint \
        || test %{app-bundle-id} = com.apple.ActivityMonitor \
        || test %{app-bundle-id} = com.microsoft.Excel"""
    run = 'move-node-to-workspace 4-ofc'

# Workspace 7 — Notes / Documents / Utils
[[on-window-detected]]
    if = """test %{app-bundle-id} = com.apple.Preview \
        || test %{app-bundle-id} = notion.id \
        || test %{app-bundle-id} = md.obsidian \
        || test %{app-bundle-id} = com.automattic.SimplenoteMac \
        || test %{app-bundle-id} = com.apple.Notes \
        || test %{app-bundle-id} = com.g5532446.Balance \
        || test %{app-bundle-id} = com.fabian.hasse.haushaltsbuch \
        || test %{app-bundle-id} = org.m0k.transmission \
        || test %{app-bundle-id} = com.bitwarden.desktop \
        || test %{app-bundle-id} = com.apple.Music \
        || test %{app-bundle-id} = com.swinsian.Swinsian \
        || test %{app-bundle-id} = com.apple.Passwords \
        || test %{app-bundle-id} = io.ente.auth.mac \
        || test %{app-bundle-id} = com.apple.AppStore"""
    run = 'move-node-to-workspace 7-doc'

# Workspace 8 — Messengers
[[on-window-detected]]
    if = """test %{app-bundle-id} = ru.keepcoder.Telegram \
        || test %{app-bundle-id} = com.insystem.reddyosx"""
    run = ['move-node-to-workspace 8-msg']

# Workspace 9 — Calls / Remote
[[on-window-detected]]
    if = """test %{app-bundle-id} = us.zoom.xos \
        || test %{app-bundle-id} = ru.yandex.desktop.telemost \
        || test %{app-bundle-id} = com.microsoft.rdc.macos \
        || test %{app-bundle-id} = com.apple.ScreenContinuity \
        || test %{app-bundle-id} = com.resilio.Sync \
        || test %{app-bundle-id} = org.localsend.localsendApp \
        || test %{app-bundle-id} = com.carriez.rustdesk"""
    run = 'move-node-to-workspace 9-con'
