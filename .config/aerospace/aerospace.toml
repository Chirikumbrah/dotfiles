after-login-command = []
after-startup-command = []
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
non-empty-workspaces-root-containers-layout-on-startup = 'smart'
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
key-mapping.preset = 'qwerty'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = 'move-mouse window-lazy-center'

[gaps]
inner.horizontal = 0
inner.vertical =   0
outer.left =       0
outer.bottom =     0
outer.top =        0
outer.right =      0

[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
alt-enter = 'exec-and-forget open /Applications/Alacritty.app'
alt-shift-w = 'exec-and-forget open -a /Applications/Brave\ Browser.app'
alt-shift-t = 'exec-and-forget open -a /Applications/Telegram.app'
alt-shift-s = 'exec-and-forget open -a /Applications/Simplenote.app'
alt-shift-c = 'exec-and-forget open -a /System/Applications/Calculator.app'
alt-shift-e = 'exec-and-forget open -a /System/Library/CoreServices/Finder.app'
alt-shift-b = 'exec-and-forget open -a /Applications/Bitwarden.app'
alt-shift-d = 'exec-and-forget open -a /Applications/iTranslate.app'


# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-s = 'layout v_accordion' # 'layout stacking' in i3
alt-w = 'layout h_accordion' # 'layout tabbed' in i3
alt-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

alt-o = 'layout floating tiling'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-n = 'workspace next'
alt-shift-p = 'workspace prev'

alt-n = ['focus-monitor next', 'move-mouse window-force-center']
alt-p = ['focus-monitor prev', 'move-mouse window-force-center']

alt-r = 'mode resize'

alt-f = 'fullscreen'

# alt-c = 'center window'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = 'mode service'

alt-shift-f = 'macos-native-fullscreen'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'
cmd-alt-1 = 'workspace 11'
cmd-alt-2 = 'workspace 12'
cmd-alt-3 = 'workspace 13'
cmd-alt-4 = 'workspace 14'
cmd-alt-5 = 'workspace 15'
cmd-alt-6 = 'workspace 16'
cmd-alt-7 = 'workspace 17'
cmd-alt-8 = 'workspace 18'
cmd-alt-9 = 'workspace 19'
cmd-alt-0 = 'workspace 20'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'
cmd-alt-shift-1 = 'move-node-to-workspace 11'
cmd-alt-shift-2 = 'move-node-to-workspace 12'
cmd-alt-shift-3 = 'move-node-to-workspace 13'
cmd-alt-shift-4 = 'move-node-to-workspace 14'
cmd-alt-shift-5 = 'move-node-to-workspace 15'
cmd-alt-shift-6 = 'move-node-to-workspace 16'
cmd-alt-shift-7 = 'move-node-to-workspace 17'
cmd-alt-shift-8 = 'move-node-to-workspace 18'
cmd-alt-shift-9 = 'move-node-to-workspace 19'
cmd-alt-shift-0 = 'move-node-to-workspace 20'

[workspace-to-monitor-force-assignment]
11 = 'secondary'
12 = 'secondary'
13 = 'secondary'
14 = 'secondary'
15 = 'secondary'
16 = 'secondary'
17 = 'secondary'
18 = 'secondary'
19 = 'secondary'
20 = 'secondary'

[mode.resize.binding]
h = 'resize width +50'
j = 'resize height -50'
k = 'resize height +50'
l = 'resize width -50'
b = 'balance-sizes'
q = 'mode main'
enter = 'mode main'
esc = 'mode main'
alt-r = 'mode main'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
q = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']


# Floating windows
[[on-window-detected]]
if.app-name-regex-substring = 'Finder'
run = 'layout floating'

