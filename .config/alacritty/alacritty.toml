[debug]
log_level = "Off"

[font]
size = 17
normal = { family = "UbuntuMono Nerd Font" }

[terminal.shell]
program = "bash"
args = ["-l", "-c", "tmux attach || tmux new -s y || exec bash"]

[colors.primary]
background = "#000000"

[window]
decorations = "None"
startup_mode = "Maximized"
option_as_alt = "Both"
padding = { x = 2, y = 2 }
